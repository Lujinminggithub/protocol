name: NB CI

on:
  push:
    paths:
      - "NB/**"
      - ".github/workflows/nb-ci.yml"
  pull_request:
    paths:
      - "NB/**"
      - ".github/workflows/nb-ci.yml"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev ninja-build
          python -m pip install --disable-pip-version-check paramiko
      - name: P0 and P1 repository gates
        run: |
          python tools/p0_gate.py
          python tools/p1_gate.py
      - name: Configure and build
        run: cmake -S . -B build-ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Unit tests
        run: |
          cmake --build build-ci-release --parallel 2
          ctest --test-dir build-ci-release --output-on-failure
      - name: Three-hop loopback
        run: NB_BIN="$PWD/build-ci-release/nb_node" bash scripts/runtri.sh

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NB
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev ninja-build
      - name: Configure ASan and UBSan
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: cmake -S . -B build-ci-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Sanitized unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build build-ci-sanitize --parallel 2
          ctest --test-dir build-ci-sanitize --output-on-failure
