# Fixed live path focused on mobile -> GZ -> HK -> overseas -> TikTok
node_name=gz-ingress-1
transport=udp
hop_name=gz
listen_host=0.0.0.0
tun_name=xgw0
tun_addr=10.0.0.1/24
device=eth0
queue_id=0
role=ingress
profile=live-bbr
path=phone@mobile=0.0.0.0:0,gz@ingress=106.75.143.135:51830,hk@relay=10.0.0.2:51830,us@egress=45.10.10.10:51830

# Minimal traffic profile knobs
mtu=1280
payload_size=1100
reorder_window=128
fec_data_shards=4
fec_parity_shards=1
pacing_rate_bps=50000000
pacing_interval_us=200
redundant_copies=1

# Preserve whitelist ability
policy_group=default
allow_cidrs=17.0.0.0/8,8.8.8.8/32,1.1.1.1/32
allow_domains=live.tiktok.com
allow_domain_suffixes=tiktokcdn.com,byteoversea.com
conservative_domain_allow=false
dynamic_grace_period_sec=30
manifest_url=https://example.com/policy.srs
dns_listen=10.0.0.4:53
dns_upstream=8.8.8.8:53

# Preserve DOS whitelist + blacklist ability
dos_enabled=true
max_connections=1000
max_connections_per_ip=100
rate_limit_per_second=1000
rate_limit_burst=2000
blacklist_duration_sec=300
whitelist_ips=106.75.31.69,106.75.143.135,106.75.141.139
