{
  "appId": "com.personalsafer.app",
  "productName": "PersonalSafer",
  "directories": {
    "output": "../../dist"
  },
  "electronDist": "node_modules/electron/dist",
  "electronVersion": "28.3.3",
  "files": [
    "dist-electron/**/*",
    "dist/**/*"
  ],
  "extraResources": [
    {
      "from": "native",
      "to": "native",
      "filter": ["**/*.node"]
    },
    {
      "from": "driver",
      "to": "driver",
      "filter": ["PersonalSafer.sys", "PersonalSafer.inf", "PersonalSafer-Test.cer"]
    }
  ],
  "win": {
    "target": "nsis",
    "requestedExecutionLevel": "requireAdministrator",
    "signAndEditExecutable": false
  },
  "nsis": {
    "oneClick": false,
    "perMachine": true,
    "allowToChangeInstallationDirectory": true,
    "runAfterFinish": false,
    "include": "build/installer.nsh",
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "shortcutName": "PersonalSafer"
  }
}
