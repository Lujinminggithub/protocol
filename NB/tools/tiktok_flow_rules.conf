# TikTok 内部分流规则
# 仅在白名单通过后进入本分类器
# 语法:
#   match <pattern> class=<ctrl|media|bulk> lane=<latency|bulk> fec=<auto|off|force> prio=<n>
#
# 说明:
# - pattern 末尾带 * 时按“host 中包含该 stem”匹配
# - 当前优先服务 TikTok 内部分类，不负责白名单

match api*         class=ctrl  lane=latency fec=off  prio=8
match im-api*      class=ctrl  lane=latency fec=off  prio=8
match tnc*         class=ctrl  lane=latency fec=off  prio=8
match log*         class=ctrl  lane=latency fec=off  prio=8
match logger*      class=ctrl  lane=latency fec=off  prio=8
match mcs*         class=ctrl  lane=latency fec=off  prio=8
match mon*         class=ctrl  lane=latency fec=off  prio=8
match common-sign* class=ctrl  lane=latency fec=off  prio=8

match rtc-access*  class=media lane=latency fec=auto prio=4
match rtc*         class=media lane=latency fec=auto prio=4
match frontier*    class=media lane=latency fec=auto prio=4
match webcast*     class=media lane=latency fec=auto prio=4
match pull-f5*     class=media lane=latency fec=auto prio=4
match ttcdn*       class=media lane=latency fec=auto prio=4
match teko*        class=media lane=latency fec=auto prio=4
match sf16*        class=media lane=latency fec=auto prio=4
match sf19*        class=media lane=latency fec=auto prio=4

match aggr*        class=bulk  lane=bulk    fec=off  prio=20
match tos*         class=bulk  lane=bulk    fec=off  prio=20
match oec*         class=bulk  lane=bulk    fec=off  prio=20
