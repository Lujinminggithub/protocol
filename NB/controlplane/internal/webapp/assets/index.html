<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NB 运营控制台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">NB</span><span>运营控制台</span></div>
      <nav aria-label="主导航">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>总览</button>
        <button class="nav-item" data-view="lines"><span class="nav-icon">⇄</span>线路</button>
        <button class="nav-item" data-view="operations"><span class="nav-icon">↻</span>操作任务</button>
        <button class="nav-item" data-view="incidents"><span class="nav-icon">!</span>告警</button>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="apiDot"></span>
        <span id="apiStatus">未连接</span>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="viewTitle">线路总览</h1>
          <p id="viewSubtitle">统一查看线路容量、健康与运行状态</p>
        </div>
        <div class="top-actions">
          <span class="updated" id="updatedAt">--</span>
          <button class="icon-button" id="refreshButton" title="刷新" aria-label="刷新">↻</button>
          <button class="primary" id="newLineButton">新增线路</button>
        </div>
      </header>

      <section class="view active" id="overviewView">
        <div class="metrics" id="metrics"></div>
        <div class="section-head"><div><h2>线路状态</h2><p>按最新 worker 快照聚合</p></div><div class="legend"><span><i class="good"></i>健康</span><span><i class="warn"></i>异常</span></div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>线路</th><th>状态</th><th>拓扑</th><th>容量 / 当前</th><th>会话</th><th>延迟队列</th><th>有效丢包</th><th>部署</th></tr></thead>
            <tbody id="overviewLines"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="linesView">
        <div class="toolbar"><input id="lineSearch" type="search" placeholder="搜索线路、区域或运营商"><select id="lineStatus"><option value="">全部状态</option><option value="active">运行中</option><option value="draft">草稿</option><option value="validating">验证中</option><option value="maintenance">维护</option><option value="disabled">停用</option></select></div>
        <div class="table-wrap">
          <table><thead><tr><th>线路</th><th>状态</th><th>入口</th><th>出口</th><th>运营商</th><th>容量</th><th>Profile</th><th>操作</th></tr></thead><tbody id="linesTable"></tbody></table>
        </div>
      </section>

      <section class="view" id="operationsView">
        <div class="toolbar"><select id="operationLine"><option value="">全部线路</option></select><button class="secondary" id="reloadOperations">刷新任务</button></div>
        <div class="table-wrap"><table><thead><tr><th>任务</th><th>线路</th><th>类型</th><th>状态</th><th>发起人</th><th>创建时间</th><th>更新时间</th></tr></thead><tbody id="operationsTable"></tbody></table></div>
      </section>

      <section class="view" id="incidentsView">
        <div class="section-head"><div><h2>线路告警</h2><p>按发生时间倒序</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>级别</th><th>线路</th><th>类型</th><th>状态</th><th>消息</th><th>时间</th></tr></thead><tbody id="incidentsTable"></tbody></table></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="authModal">
    <form class="modal auth-modal" id="authForm" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-head"><div><h2 id="authTitle">连接控制台</h2><p>Windows 中央控制面</p></div></div>
      <label>管理员令牌<input id="tokenInput" type="password" autocomplete="current-password" required></label>
      <div class="form-error" id="authError"></div>
      <button class="primary full" type="submit">连接</button>
    </form>
  </div>

  <div class="modal-backdrop hidden" id="lineModal">
    <form class="modal wide" id="lineForm" role="dialog" aria-modal="true" aria-labelledby="lineModalTitle">
      <div class="modal-head"><div><h2 id="lineModalTitle">新增线路</h2><p>登记线路后创建验证或开线任务</p></div><button type="button" class="icon-button close-modal" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <label>线路 ID<input name="id" placeholder="gz-hk-us" required pattern="[A-Za-z0-9_.-]+"></label>
        <label>显示名称<input name="name" placeholder="广州 · 香港 · 美国" required></label>
        <label>入口区域<input name="entry_region" placeholder="广州" required></label>
        <label>出口区域<input name="exit_region" placeholder="美国" required></label>
        <label>运营商<input name="provider" placeholder="多运营商"></label>
        <label>容量 Mbps<input name="capacity_mbps" type="number" min="0" value="10" required></label>
        <label>Profile<input name="profile" placeholder="gz-hk-us:1"></label>
        <label>密钥引用<input name="secret_ref" placeholder="vault/nb/lines/gz-hk-us"></label>
      </div>
      <label>初始状态<select name="status"><option value="draft">草稿</option><option value="validating">验证中</option><option value="active">运行中</option><option value="maintenance">维护</option><option value="disabled">停用</option></select></label>
      <div class="form-error" id="lineError"></div>
      <div class="modal-actions"><button type="button" class="secondary close-modal">取消</button><button type="submit" class="primary">保存线路</button></div>
    </form>
  </div>

  <div class="modal-backdrop hidden" id="operationModal">
    <form class="modal" id="operationForm" role="dialog" aria-modal="true" aria-labelledby="operationTitle">
      <div class="modal-head"><div><h2 id="operationTitle">创建任务</h2><p id="operationTarget"></p></div><button type="button" class="icon-button close-operation" aria-label="关闭">×</button></div>
      <input type="hidden" name="line_id"><input type="hidden" name="kind">
      <label>发起人<input name="requested_by" value="operator" required pattern="[A-Za-z0-9_.-]+"></label>
      <label>目标 deployment<input name="deployment" placeholder="可留空"></label>
      <label>备注<textarea name="note" rows="3" placeholder="变更窗口或审批编号"></textarea></label>
      <div class="form-error" id="operationError"></div>
      <div class="modal-actions"><button type="button" class="secondary close-operation">取消</button><button type="submit" class="primary">提交任务</button></div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
