name: repository-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: controlplane/go.sum
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make libssl-dev pkg-config
          python -m pip install paramiko
      - name: Repository gates
        run: |
          python tools/source_gate.py
          python tools/p0_gate.py
          python tools/p1_gate.py
          python tools/p2_gate.py
      - name: C build and tests
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-ci -j2
          ctest --test-dir build-ci --output-on-failure
      - name: Go control plane
        working-directory: controlplane
        run: go test ./...
      - name: Xray protocol adapter
        working-directory: client/xraydemo
        run: go test ./...
